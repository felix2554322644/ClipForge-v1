name: Generate AI Video V1

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video topic to generate (e.g. "How black holes destroy stars")'
        required: true
        type: string
        default: 'How black holes destroy stars'
      duration:
        description: 'Target video duration in seconds'
        required: false
        type: string
        default: '24'
      profile:
        description: 'Target vertical video profile'
        required: false
        type: choice
        options:
          - vertical-1080
          - vertical-720
          - vertical-540
        default: vertical-1080

jobs:
  generate:
    name: Autonomous Video Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Multimedia Tools (FFmpeg & FFprobe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Cache Piper TTS Runtime & Voice Model
        id: cache-piper
        uses: actions/cache@v4
        with:
          path: |
            bin/piper
            models
          key: piper-${{ runner.os }}-${{ runner.arch }}-2023.11.14-2-lessac-v1
          restore-keys: |
            piper-${{ runner.os }}-${{ runner.arch }}-2023.11.14-2-

      - name: Install or Restore Piper Local TTS & Voice Model
        run: |
          bash scripts/setup-piper.sh

      - name: Install Project Dependencies
        run: npm ci

      - name: Verify Piper Local TTS Runtime & Voice Model Integrity
        env:
          PIPER_BIN: ./bin/piper/piper
          PIPER_MODEL: ./models/en_US-lessac-medium.onnx
          FFPROBE_BIN: ffprobe
        run: |
          npm run verify:piper

      - name: Verify Environment & Pipeline Dependencies
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPER_BIN: ./bin/piper/piper
          PIPER_MODEL: ./models/en_US-lessac-medium.onnx
        run: |
          npm run test:contracts

      - name: Execute End-to-End Video Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPER_BIN: ./bin/piper/piper
          PIPER_MODEL: ./models/en_US-lessac-medium.onnx
          FFMPEG_BIN: ffmpeg
          FFPROBE_BIN: ffprobe
          ALLOW_FALLBACKS: 'false'
        run: |
          npm run generate -- --topic "${{ github.event.inputs.topic }}" --duration "${{ github.event.inputs.duration }}" --profile "${{ github.event.inputs.profile }}"

      - name: Verify Final Output Artifacts
        run: |
          LATEST_DIR=$(ls -td artifacts/job_* 2>/dev/null | head -n 1)
          if [ -z "$LATEST_DIR" ] || [ ! -f "$LATEST_DIR/final-video.mp4" ]; then
            echo "ERROR: final-video.mp4 was not generated!"
            exit 1
          fi
          echo "Pipeline produced valid video at: $LATEST_DIR/final-video.mp4"
          ls -lh "$LATEST_DIR"

      - name: Upload Final Video MP4 & Pipeline Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-generation-output-${{ github.run_id }}
          path: |
            artifacts/job_*/final-video.mp4
            artifacts/job_*/*.json
            artifacts/job_*/*.log
            artifacts/job_*/*.wav
          retention-days: 30
